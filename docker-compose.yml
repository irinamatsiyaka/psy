services:
  postgres:
    image: postgres:16-alpine
    container_name: psy-postgres
    environment:
      POSTGRES_DB: psy
      POSTGRES_USER: psy
      POSTGRES_PASSWORD: psy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psy -d psy"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: psy-backend
    environment:
      NODE_ENV: development
      PORT: 5012
      DATABASE_URL: postgresql://psy:psy@postgres:5432/psy
      JWT_ACCESS_SECRET: dev_access_secret_change_me
      JWT_REFRESH_SECRET: dev_refresh_secret_change_me
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 7
      CORS_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
    ports:
      - "5012:5012"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: psy-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:5012
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
